name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel stale runs when a new push lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml is the single source of truth for the toolchain
      # version and components (rustfmt + clippy). `rustup show` installs exactly
      # what it pins, so CI and local builds can never drift.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (unit + integration)
        run: cargo test --workspace --all-targets

      - name: Doc tests
        run: cargo test --workspace --doc

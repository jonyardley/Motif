# motif-core must stay pure and deterministic (see CLAUDE.md and design spec §8).
# These bans turn determinism/I-O violations into `cargo clippy -- -D warnings`
# failures, so CI catches them instead of relying on a human reviewer.
#
# The core takes the current time as an explicit `now: DateTime<Utc>` argument and
# performs no I/O — the Swift shell owns the filesystem, audio, and the clock. If a
# call site ever legitimately needs one of these, add a narrowly-scoped
# `#[allow(clippy::disallowed_methods)]` with a comment rather than loosening this list.

disallowed-methods = [
    { path = "chrono::Utc::now", reason = "core must be deterministic — take `now: DateTime<Utc>` as a parameter" },
    { path = "chrono::Local::now", reason = "core must be deterministic — take `now: DateTime<Utc>` as a parameter" },
    { path = "std::time::SystemTime::now", reason = "core must be deterministic — take time as a parameter" },
    { path = "std::time::Instant::now", reason = "core must be deterministic — take time as a parameter" },
]

disallowed-types = [
    { path = "std::fs::File", reason = "core performs no I/O — the Swift shell owns the filesystem (design §8)" },
]
